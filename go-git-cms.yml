version: 1
content_models:
  - name: pages
    path: "src/content/pages/*.mdx"
    label: "{{ title }}"
    fields:
      - name: title
        type: string
  - name: articles
    path: "src/content/articles/*.mdx"
    label: "{{ title }}"
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
      - name: pubDate
        type: string
        display:
          component: date
      - name: category
        type: string
        enum:
          - all
          - software-design
          - software-engineering
          - web-development
          - systems-thinking
          - writing
        display:
          component: select
      - name: draft
        type: boolean
      - name: body
        label: body
        type: string
        display:
          component: 'plugin:mdx'
          source: body
  - name: projects
    path: "src/content/projects/*.mdx"
    label: "{{ title }}"
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
        required: true
      - name: link
        type: string
        required: true
      # A path relative to the project's file, e.g. ../../assets/images/logos/companion.svg
      - name: logo
        type: string
      - name: draft
        type: boolean
      - name: body
        label: body
        type: string
        display:
          component: 'plugin:mdx'
          source: body
forms:
  # The "Get in touch" form at /contact (src/pages/contact.astro). It has no
  # `store:` on purpose: this repository is public, and submissions carry
  # people's names and email addresses, so they stay in the CMS's inbox.
  - name: contact
    label: Contact
    description: Messages sent from the Get in touch form at /contact.
    # A decoy input the page renders but visitors never see. Bots fill it in,
    # and the CMS files those submissions under Spam.
    honeypot: website
    rate_limit:
      per_minute: 5
    fields:
      - name: name
        label: Name
        type: string
        required: true
        validate:
          - rule: maxLength
            value: 200
      - name: email
        label: Email
        type: string
        required: true
        display:
          component: email
        validate:
          - rule: email
      - name: message
        label: Message
        type: string
        required: true
        display:
          component: textarea
        validate:
          - rule: maxLength
            value: 5000


