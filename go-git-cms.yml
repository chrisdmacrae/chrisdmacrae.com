# yaml-language-server: $schema=https://app.gogitcms.com/schemas/go-git-cms.json
# GoGitCMS schema configuration
# See: https://docs.gogitcms.com/schema

version: 1
content_models:
  - name: pages
    path: "src/content/pages/*.mdx"
    format: markdown
    previewUrl: "{{.Filename}}"
    fields:
      - name: title
        type: string
        entry_title: true
  - name: articles
    path: "src/content/articles/*.mdx"
    previewUrl: /articles/{{.Filename}}
    format: markdown
    fields:
      - name: title
        type: string
        entry_title: true
        required: true
      - name: description
        type: string
      - name: pubDate
        type: string
        display:
          component: date
      - name: category
        type: string
        enum:
          - all
          - design-management
          - engineering-management
          - web-development
          - systems-thinking
          - writing
        display:
          component: select
      - name: draft
        type: boolean
