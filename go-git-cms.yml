version: 1
content_models:
  - name: pages
    path: "src/content/pages/*.mdx"
    label: "{{ title }}"
    fields:
      - name: title
        type: string
  - name: articles
    path: "src/content/articles/*.mdx"
    label: "{{ title }}"
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
      - name: pubDate
        type: string
        display:
          component: date
      - name: category
        type: string
        enum:
          - all
          - design-management
          - engineering-management
          - web-development
          - systems-thinking
          - writing
        display:
          component: select
      - name: draft
        type: boolean
      - name: body
        label: body
        type: string
        display:
          component: 'plugin:mdx'
          source: body


